<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Perpustakaan - Frontend API</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>Katalog Perpustakaan</h1>
        <p class="subtitle">Manajemen data buku &amp; kategori via REST API</p>
      </div>
      <button id="btnRefreshAll" type="button" class="btn btn-secondary">Muat Ulang Semua</button>
    </header>

    <div id="alertBox" class="alert hidden" role="alert"></div>

    <main class="grid">
      <div class="stack">
        <section class="card">
          <h2 id="bookFormTitle">Tambah Buku Baru</h2>
          <form id="bookForm">
            <input type="hidden" id="bookId" />

            <div class="form-group">
              <label for="judul">Judul Buku *</label>
              <input type="text" id="judul" name="judul" placeholder="Contoh: Clean Architecture" required />
            </div>

            <div class="form-group">
              <label for="penulis">Penulis *</label>
              <input type="text" id="penulis" name="penulis" placeholder="Contoh: Robert C. Martin" required />
            </div>

            <div class="form-group">
              <label for="categoryId">Kategori</label>
              <select id="categoryId" name="category_id">
                <option value="">-- Tanpa Kategori --</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="tahun">Tahun Terbit *</label>
                <input type="number" id="tahun" name="tahun" min="1000" max="2099" placeholder="2017" required />
              </div>

              <div class="form-group">
                <label for="stok">Stok *</label>
                <input type="number" id="stok" name="stok" min="0" placeholder="5" required />
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" id="btnBookSubmit" class="btn btn-primary">Simpan Buku</button>
              <button type="button" id="btnBookCancel" class="btn btn-secondary hidden">Batal</button>
            </div>
          </form>
        </section>

        <section class="card">
          <h2 id="categoryFormTitle">Tambah Kategori</h2>
          <form id="categoryForm">
            <input type="hidden" id="categoryEditId" />

            <div class="form-group">
              <label for="categoryName">Nama Kategori *</label>
              <input type="text" id="categoryName" name="name" placeholder="Contoh: Pemrograman" required />
            </div>

            <div class="form-group">
              <label for="categoryDesc">Deskripsi</label>
              <input type="text" id="categoryDesc" name="description" placeholder="Opsional" />
            </div>

            <div class="form-actions">
              <button type="submit" id="btnCategorySubmit" class="btn btn-primary">Simpan Kategori</button>
              <button type="button" id="btnCategoryCancel" class="btn btn-secondary hidden">Batal</button>
            </div>
          </form>

          <div class="category-list-wrap">
            <h3>Daftar Kategori</h3>
            <ul id="categoryList" class="category-list">
              <li class="empty">Memuat kategori...</li>
            </ul>
          </div>
        </section>
      </div>

      <section class="card">
        <div class="card-header">
          <h2>Daftar Buku</h2>
          <span id="bookCount" class="badge">0 buku</span>
        </div>

        <div class="toolbar">
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Cari judul atau penulis buku..."
          />
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Judul</th>
                <th>Penulis</th>
                <th>Kategori</th>
                <th>Tahun</th>
                <th>Stok</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="bookTableBody">
              <tr>
                <td colspan="7" class="empty">Memuat data buku...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
